# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets).
#
# No `secrets:` line: the reusable workflow (standards@75bd5994) declares no
# secrets and reads none. Its gitleaks is a pinned local binary, and the
# GITHUB_TOKEN its jobs run under is governed by `permissions:`, not by secret
# passing. `secrets: inherit` would forward every repository secret for nothing.
name: "Secret Scanner"
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
